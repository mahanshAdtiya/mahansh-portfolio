  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(22px,6vh,64px);padding-right:{{ heroPad }}\">\n      <span>Bengaluru, IND<\u002Fspan>\n      <span>Headout · since Aug 2025<\u002Fspan>\n      <span style=\"color:#7f2b2b\">Available for freelance work<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(38px,5.6vw,80px);line-height:1.02;letter-spacing:-0.02em;max-width:{{ heroH1Max }};text-wrap:pretty;position:relative;z-index:2;padding-right:{{ heroPad }}\">\n      One engineer, <em style=\"font-style:italic;color:#7f2b2b\">the whole stack.<\u002Fem>\n    <\u002Fh1>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap;margin:clamp(28px,7vh,72px) 0 0;padding-right:{{ heroPad }}\">\n      <p style=\"margin:0;max-width:48ch;font-size:clamp(14px,3.6vw,15px);line-height:1.75;color:#5c5050\">Freelance builds — web apps, storefronts, internal tools — taken from architecture to interface, by one person who does both.<\u002Fp>\n      <div style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a5b5b;display:flex;align-items:center;gap:10px\">\n        <span>Scroll<\u002Fspan>\n        <span style=\"width:56px;height:1px;background:#cbbdb4;display:inline-block\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" data-reveal-root=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vh,80px) clamp(16px,4vw,56px) clamp(64px,14vh,160px)\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #e6ded4;padding-bottom:14px;margin-bottom:clamp(32px,7vh,80px)\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;color:#7f2b2b\">01<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(26px,6vw,52px);line-height:1.05\">The short version<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(28px,4vw,56px)\">\n      <div>\n        <p style=\"margin:0 0 20px;font-family:'Instrument Serif',serif;font-size:clamp(21px,4.6vw,32px);line-height:1.3;letter-spacing:-0.01em\">Two years spent where the load is: queues, jobs, and the dashboards that depend on them.<\u002Fp>\n        <p style=\"margin:0;font-size:15px;line-height:1.75;color:#5c5050\">B.Tech CSE with a Specialisation in Design, IIIT Delhi. The design half shows up in the tools other teams use every day — admin panels, flow editors, CRMs.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:1px;background:#e6ded4;border:1px solid #e6ded4;align-content:start\">\n        <div style=\"background:#f6f3ee;padding:20px 22px\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a5b5b;margin-bottom:8px\">Works on<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#3a2f2f\">Async job orchestration, event ingestion pipelines, data freshness, notification delivery<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f6f3ee;padding:20px 22px\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a5b5b;margin-bottom:8px\">Reaches for<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#3a2f2f\">Kotlin + Spring Boot, Golang, PostgreSQL, Kafka, Redis, Next.js<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f6f3ee;padding:20px 22px\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a5b5b;margin-bottom:8px\">Also happy doing<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#3a2f2f\">Full-stack product work end to end — architecture, API, and the interface on top<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showMetrics }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:#e6ded4;border:1px solid #e6ded4;margin-top:clamp(32px,6vh,72px)\">\n        <div style=\"background:#f6f3ee;padding:24px 22px\">\n          <div data-count=\"5\" data-suffix=\" min\" style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,7vw,44px);line-height:1;color:#7f2b2b\">5 min<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#5c5050;margin-top:10px\">Cap on booking-dashboard data lag, replacing a BigQuery source<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f6f3ee;padding:24px 22px\">\n          <div data-count=\"70\" data-suffix=\"%\" style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,7vw,44px);line-height:1;color:#7f2b2b\">70%<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#5c5050;margin-top:10px\">API latency cut by relocating backend and database closer to users<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f6f3ee;padding:24px 22px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(28px,6vw,36px);line-height:1.2;color:#7f2b2b\">1 day → hrs<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#5c5050;margin-top:10px\">Chapter setup time, after a visual branching-flow editor replaced JSON config<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f6f3ee;padding:24px 22px\">\n          <div data-count=\"25\" data-suffix=\"%\" style=\"font-family:'Instrument Serif',serif;font-size:clamp(34px,7vw,44px);line-height:1;color:#7f2b2b\">25%<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:#5c5050;margin-top:10px\">Faster initial load from lazy-loading and deferred API calls<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if ext }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ expPicker }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:{{ expCols }};gap:clamp(24px,4vw,64px);align-items:start\">\n      <div style=\"display:grid;gap:2px;position:{{ expListPos }};top:96px\">\n        <sc-for list=\"{{ roles }}\" as=\"role\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ role.pick }}\" style=\"text-align:left;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:18px 18px;min-height:44px;border:1px solid {{ role.border }};background:{{ role.bg }};transition:background 260ms,border-color 260ms\">\n            <span style=\"display:block\">\n              <span style=\"display:block;font-family:'Instrument Serif',serif;font-size:clamp(20px,2.4vw,26px);line-height:1.15;color:{{ role.fg }}\">{{ role.company }}<\u002Fspan>\n              <span style=\"display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:{{ role.sub }};margin-top:6px\">{{ role.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;white-space:nowrap;color:{{ role.sub }}\">{{ role.years }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #1a1414;padding-top:clamp(22px,3vh,32px)\">\n        <h3 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,5.4vw,44px);line-height:1.05\">{{ sel.title }}<\u002Fh3>\n        <div style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6a5b5b;margin-top:12px;display:fl x,3.8vw,18px);word-break:break-all\">singh.mahansh@gmail.com<\u002Fdiv>\n        <\u002Fa>\n        <a href=\"tel:+918076326534\" style=\"background:#1a1414;padding:26px 24px;color:#f6f3ee;display:block\" style-hover=\"background:#221a1a\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a08f8f;margin-bottom:10px\">Phone<\u002Fdiv>\n          <div style=\"font-size:clamp(15px,3.8vw,18px)\">+91 8076326534<\u002Fdiv>\n        <\u002Fa>\n        <a href=\"https://www.linkedin.com/\" target=\"_blank\" style=\"background:#1a1414;padding:26px 24px;color:#f6f3ee;display:block\" style-hover=\"background:#221a1a\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a08f8f;margin-bottom:10px\">LinkedIn<\u002Fdiv>\n          <div style=\"font-size:clamp(15px,3.8vw,18px)\">Connect →<\u002Fdiv>\n        <\u002Fa>\n        <a href=\"https://github.com/\" target=\"_blank\" style=\"background:#1a1414;padding:26px 24px;color:#f6f3ee;display:block\" style-hover=\"background:#221a1a\">\n          <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a08f8f;margin-bottom:10px\">GitHub<\u002Fdiv>\n          <div style=\"font-size:clamp(15px,3.8vw,18px)\">See the code →<\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n      <a href=\"uploads/mahansh_resume.pdf\" target=\"_blank\" style=\"display:inline-flex;align-items:center;gap:12px;margin-top:clamp(28px,5vh,52px);border:1px solid #cf7b6f;color:#cf7b6f;padding:16px 26px;border-radius:999px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-height:44px\" style-hover=\"background:#cf7b6f;color:#1a1414\">Download résumé ↓<\u002Fa>\n      <div style=\"margin-top:clamp(64px,12vh,130px);position:relative;overflow:hidden;border-top:1px solid #382a2a\">\n        <div aria-hidden=\"true\" style=\"font-family:'Instrument Serif',serif;font-size:21.5vw;line-height:0.74;letter-spacing:-0.035em;color:#241b1b;white-space:nowrap;text-align:center;margin:clamp(24px,4vh,44px) 0 -0.16em;pointer-events:none;user-select:none\">Mahansh<\u002Fdiv>\n        <div style=\"position:relative;z-index:2;border-top:1px solid #382a2a;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#97867f\">\n          <span>© 2026 Mahansh Aditya · Bengaluru<\u002Fspan>\n          <span>IIIT Delhi, B.Tech CSE (Design) 2021–2025<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showMetrics&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nconst NEAR = ['#cf7b6f','#b85c56','#9c4a45'];\n\nconst GROUPS = {\n  Found: ['Foundations', 'The parts that outlast any framework: data structures and algorithms, OOP, REST API design, and distributed-systems thinking.'],\n  Front: ['Frontend', 'React and Next.js for the interface — storefronts, admin panels and internal tools that other teams use daily.'],\n  Back: ['Backend', 'Kotlin with Spring Boot day to day, Golang for concurrent pipelines, Node and Express or FastAPI where they fit better.'],\n  Db: ['Database', 'PostgreSQL as the default store, MongoDB where documents suit, Redis for caching, Kafka for events, BigQuery for analytical loads.'],\n  Cloud: ['Cloud & tools', 'AWS for compute and Lambda workloads, Docker for parity between local and production, Git and GitHub for everything else.']\n};\n\nconst ROLES = [\n  {\n    company: 'Headout', title: 'Software Engineer', years: '2025—now',\n    dates: 'Aug 2025 — Present', place: 'Sarjapur, Bengaluru',\n    tech: ['Kotlin', 'Spring Boot', 'PostgreSQL', 'Kafka', 'AWS Lambda', 'BigQuery'],\n    changed: [\n      'Improved booking dashboard data freshness by replacing a BigQuery source with a dataset capped at 5-minute lag, reducing supplier booking visibility by 80%.',\n      'Migrated booking dashboard exports from the application server to AWS Lambda, isolating resource-intensive BigQuery workloads from core APIs and improving service resource utilization.'\n    ],\n    daily: [\n      'Designed a modular, state-driven async job orchestration layer using Spring Boot, Kotlin, PostgreSQL, and Kafka, decoupling workflows from feature-specific services, while leading the migration from Spring Boot 2.5 to 3.x.',\n      'Re-architected Slack notifications into a fire-and-forget dispatcher with 3 retries, exponential jitter, and Grafana metrics, standardizing event types with Kotlin sealed classes and enabling failure tracking by event and error reason.'\n    ]\n  },\n  {\n    company: 'Lila Games', title: 'Full-Stack Developer', years: '2025',\n    dates: 'Mar 2025 — Aug 2025', place: 'Indiranagar, Bengaluru',\n    tech: ['Golang', 'React', 'Node.js', 'Express', 'Redis', 'Nakama'],\n    changed: [\n      'Led the development of a visual branching-flow editor using React, Node.js, Express.js, and Redis, replacing manual JSON-based configuration, reducing setup time per chapter from 1 day to a few hours.',\n      'Developed integration tests across game features using Golang and Nakama, uncovering and resolving multiple system-level bugs and improving overall system reliability.'\n    ],\n    daily: [\n      'Built an asynchronous event ingestion pipeline with batching and retry mechanisms in Golang using goroutines and channels, decoupling event generation from downstream processing and batching events.',\n      'Built an internal admin panel using Next.js for game configuration, enabling QA teams to configure test environments and provision in-game resources without developer intervention.'\n    ]\n  },\n  {\n    company: 'Plunes Healthcare', title: 'Full-Stack Developer', years: '2024',\n    dates: 'Jun 2024 — Sep 2024', place: 'Gurugram, Haryana',\n    tech: ['Node', 'Express', 'MongoDB', 'Next.js'],\n    changed: [\n      'Optimized page load performance by lazy-loading non-critical data and deferring API calls until required, reducing initial loading time by 25%.',\n      'Optimized APIs by reducing unnecessary MongoDB data retrieval and introducing caching for frequently accessed data.'\n    ],\n    daily: [\n      'Built an internal insurance CRM panel using Node, Express, and MongoDB, from scratch.'\n    ]\n  }\n];\n\nclass Component extends DCLogic {\n  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, menuOpen: false, region: 0, retrieval: 1, active: '', role: 0, openRole: null, grp: null };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ w: window.innerWidth });\n    this._onScroll = () => {\n      const el = this.progress;\n      if (!el) return;\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      el.style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%';\n    };\n    window.addEventListener('resize', this._onResize);\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n    this._observeReveals();\n    this._observeSections();\n  }\n\n  // stagger every direct child of a [data-reveal-root] as it enters view\n  _observeReveals() {\n    const roots = document.querySelectorAll('[data-reveal-root]');\n    const targets = [];\n    roots.forEach(root => {\n      Array.from(root.children).forEach(child => {\n        child.setAttribute('data-reveal', '');\n        targets.push(child);\n      });\n    });\n    this._revealIO = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const sibs = Array.from(e.target.parentElement.children).filter(n => n.hasAttribute('data-reveal'));\n        e.target.style.animationDelay = Math.min(sibs.indexOf(e.target), 4) * 110 + 'ms';\n        e.target.setAttribute('data-shown', '');\n        this._countUp(e.target);\n        this._revealIO.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.12 });\n    targets.forEach(t => this._revealIO.observe(t));\n  }\n\n  _countUp(scope) {\n    scope.querySelectorAll('[data-count]').forEach(el => {\n      const to = parseFloat(el.getAttribute('data-count'));\n      const suffix = el.getAttribute('data-suffix') || '';\n      const t0 = performance.now(), dur = 1100;\n      const step = (t) => {\n        const p = Math.min(1, (t - t0) / dur);\n        const eased = 1 - Math.pow(1 - p, 3);\n        el.textContent = Math.round(to * eased) + suffix;\n        if (p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    });\n  }\n\n  _observeSections() {\n    const ids = ['about', 'experience', 'work', 'stack', 'projects', 'contact'];\n    this._sectionIO = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) this.setState({ active: e.target.id }); });\n    }, { rootMargin: '-45% 0px -45% 0px' });\n    ids.forEach(id => { const el = document.getElementById(id); if (el) this._sectionIO.observe(el); });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('scroll', this._onScroll);\n    this._revealIO && this._revealIO.disconnect();\n    this._sectionIO && this._sectionIO.disconnect();\n  }\n\n  renderVals() {\n    const mobile = this.state.w < 1080;\n    const narrow = this.state.w < 760;\n    const tablet = !narrow;\n    const wide = this.state.w >= 1080;\n    const nav = (id) => (this.state.active === id ? '#7f2b2b' : '#6b5d5d');\n    const far = this.state.region === 0;\n    const smart = this.state.retrieval === 1;\n    const kept = smart ? 14 : 48;\n    const tokens = Array.from({ length: 48 }, (_, i) => ({\n      bg: i < kept ? NEAR[i % 3] : (smart ? '#2d2222' : NEAR[i % 3])\n    }));\n    const sr = ROLES[this.state.role] || ROLES[0];\n    const g = this.state.grp;\n    const on = (k) => g === k;\n    const stack = {};\n    Object.keys(GROUPS).forEach(k => {\n      stack['hover' + k] = () => this.setState(st => ({ grp: (narrow && st.grp === k) ? null : k }));\n      stack['b' + k] = on(k) ? '#7f2b2b' : '#e6ded4';\n      stack['g' + k] = on(k) ? '#f1e7e3' : 'transparent';\n    });\n    Object.keys(GROUPS).forEach(k => {\n      stack['s' + k] = on(k) ? '#7f2b2b' : '#cfc2b6';\n      stack['w' + k] = on(k) ? 2.4 : 1.4;\n    });\n    return {\n      ...stack,\n      hoverOff: () => this.setState({ grp: null }),\n      navProjects: nav('projects'),\n      showGraph: !narrow,\n      showList: narrow,\n      graphMinH: narrow ? '640px' : (this.state.w < 1080 ? '700px' : '640px'),\n      nodeW: this.state.w < 1080 ? '30%' : '25%',\n      nodeWideW: this.state.w < 1080 ? '38%' : '30%',\n      stackHint: narrow\n        ? 'Tap a group to read what it is used for. Each icon carries its own name.'\n        : 'Hover a group to read what it is used for. Hover an icon for its name.',\n      readoutLabel: g ? GROUPS[g][0] : 'Stack',\n      readoutText: g ? GROUPS[g][1] : 'Frontend and backend on one side, data and infrastructure on the other, foundations above — all feeding one role.',\n      nowCols: mobile ? '68px 1fr' : '84px 1fr',\n      nowPos: mobile ? 'static' : 'absolute',\n      nowW: mobile ? '100%' : 'min(40vw,400px)',\n      nowMt: mobile ? 'clamp(30px,5vh,44px)' : '0px',\n      nowOrder: mobile ? 2 : 0,\n      nowOpacity: mobile ? 0.82 : 1,\n      nowBorder: '#ddd3c8',\n      nowBg: '#f1ece5',\n      nowPad: mobile ? '14px 18px' : 'clamp(18px,2vw,24px) clamp(20px,2.2vw,26px)',\n      expCols: this.state.w < 1080 ? '1fr' : 'minmax(240px, 0.85fr) minmax(0, 1.6fr)',\n      expListPos: this.state.w < 1080 ? 'static' : 'sticky',\n      expAccordion: narrow,\n      expPicker: tablet,\n      roles: ROLES.map((r, i) => {\n        const on = narrow ? this.state.openRole === i : i === this.state.role;\n        return {\n          company: r.company, title: r.title, years: r.years,\n          dates: r.dates, place: r.place,\n          tech: r.tech.map(label => ({ label })),\n          changed: r.changed.map(text => ({ text })),\n          daily: r.daily.map(text => ({ text })),\n          open: on,\n          bg: on ? '#1a1414' : 'transparent',\n          fg: on ? '#f6f3ee' : '#1a1414',\n          sub: on ? '#a08f8f' : '#6a5b5b',\n          border: on ? '#1a1414' : '#e6ded4',\n          pick: () => this.setState(st => (narrow\n            ? { openRole: st.openRole === i ? null : i }\n            : { role: i }))\n        };\n      }),\n      sel: {\n        company: sr.company, title: sr.title, dates: sr.dates, place: sr.place,\n        tech: sr.tech.map(label => ({ label })),\n        changed: sr.changed.map(text => ({ text })),\n        daily: sr.daily.map(text => ({ text }))\n      },\n      progressBar: (el) => { this.progress = el; },\n      isMobile: mobile,\n      isDesktop: !mobile,\n      isWide: wide,\n      heroH1Max: mobile ? '13em' : 'none',\n      heroMinH: mobile ? 'auto' : '100svh',\n      heroJustify: 'center',\n      heroTop: mobile ? '92px' : '104px',\n      nowShift: mobile ? 'none' : 'translateY(-50%)',\n      navAbout: nav('about'),\n      navExperience: nav('experience'),\n      navWork: nav('work'),\n      navStack: nav('stack'),\n      navContact: nav('contact'),\n      heroPad: mobile ? '0px' : 'calc(min(40vw, 400px) + clamp(16px,4vw,56px) + 56px)',\n      stickyPos: mobile ? 'relative' : 'sticky',\n      showMetrics: this.props.showMetrics ?? true,\n      menuOpen: mobile && this.state.menuOpen,\n      menuLabel: this.state.menuOpen ? 'Close ✕' : 'Menu ≡',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      toggleRegion: () => this.setState(s => ({ region: s.region === 0 ? 1 : 0 })),\n      regionLabel: far ? 'Before · US-East origin' : 'After · India-region origin + Vercel edge',\n      regionWidth: far ? '100%' : '30%',\n      regionMs: far ? 'baseline latency' : '70% lower latency',\n      regionNote: far ? 'every call crosses an ocean' : 'backend + Postgres near users',\n      toggleRetrieval: () => this.setState(s => ({ retrieval: s.retrieval === 1 ? 0 : 1 })),\n      retrievalBtn: smart ? 'Send full history' : 'Token-aware retrieval',\n      retrievalMode: smart ? 'Token-aware retrieval' : 'Full conversation history',\n      retrievalCount: kept + ' / 48 chunks sent',\n      retrievalNote: smart\n        ? 'Semantic search over pgvector picks only the chunks that matter, cutting tokens and API cost while keeping relevant context.'\n        : 'Sending everything burns tokens on history the model does not need for this turn.',\n      tokens\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
